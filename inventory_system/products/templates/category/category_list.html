{% extends "base.html" %}
{% block title %}Category List{% endblock %}

{% block content %}
<div class="container-md">
  <div class="page-header">
    <h2 class="animate-fade-down">Category List</h2>
    <a href="{% url 'category_add' %}" class="button-link animate-fade-up delay-1">Add Category</a>
  </div>

  <table class="table" style="margin-top: 20px;">
    <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Name</th>
        <th scope="col">Action</th>
      </tr>
    </thead>
    <tbody>
      {% for category in categories %}
      <tr>
        <td>{{ category.id }}</td>
        <td>{{ category.name }}</td>
        <td>
          <a href="{% url 'category_edit' category.id %}" class="button-link button-sm button-secondary">Edit</a>
          <a href="{% url 'category_delete' category.id %}" class="button-link button-sm delete-btn">Delete</a>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
