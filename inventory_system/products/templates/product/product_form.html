{% extends "base.html" %}
{% block title %}Product{% endblock %}

{% block content %}
<div class="container-md">
  <div class="page-header">
    <h2 class="animate-fade-down">{% if form.instance.pk %}Edit{% else %}Add{% endif %} Product</h2>
  </div>

  <div class="form-container">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button-link">Save</button>
      <a href="{% url 'product_list' %}" class="button-link button-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
