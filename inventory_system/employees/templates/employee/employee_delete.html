{% extends "base.html" %}
{% block title %}Delete Employee{% endblock %}

{% block content %}
<div class="container-sm">
  <div class="page-header">
    <h2 class="animate-fade-down">Delete Employee</h2>
  </div>
  <div class="form-container animate-scale-in">
    <p>Are you sure you want to delete "{{ employee.name }}"?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="button-link delete-btn">Confirm</button>
      <a href="{% url 'employee_list' %}" class="button-link button-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
