{% extends "base.html" %}
{% block title %}Edit Customer{% endblock %}

{% block content %}
<div class="container-md">
  <div class="page-header">
    <h2 class="animate-fade-down">Edit Customer</h2>
  </div>

  <div class="form-container">
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="button-link">Save</button>
      <a href="{% url 'customer_list' %}" class="button-link button-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
